<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061522">
<title>OSKO Camera — Crystal Instrument V2</title>
<style>
:root{--deep:#03101a;--sea:#0b567e;--sea2:#1688ad;--ice:#9beaff;--white:#effdff;--line:rgba(198,246,255,.64);--glass:rgba(3,28,43,.82)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#187da8 0,#082b40 34%,#02080d 82%);color:var(--white);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 10px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 16px}.brand{line-height:1}.brand small{display:block;font-family:"Brush Script MT","Segoe Script",cursive;font-size:1.18rem;letter-spacing:.05em;color:#b7f1ff;text-shadow:0 1px 0 #fff,0 3px 0 #0a587f,0 0 16px #42cfff}.brand strong{display:block;margin-top:4px;font-family:"Brush Script MT","Segoe Script",cursive;font-size:2.18rem;font-weight:800;color:#dffbff;text-shadow:0 1px 0 #fff,0 3px 0 #11688e,0 5px 8px rgba(0,0,0,.55),0 0 20px #4ed8ff}.status{font-size:.78rem;border:1px solid var(--line);background:rgba(2,18,28,.78);padding:8px 11px;border-radius:999px}.housing{position:relative;padding:10px;background:linear-gradient(145deg,rgba(225,252,255,.94),rgba(77,188,223,.78) 28%,rgba(7,66,96,.95) 70%,rgba(212,249,255,.9));clip-path:polygon(7% 0,93% 0,100% 8%,97% 92%,90% 100%,8% 98%,0 90%,2% 8%);box-shadow:0 22px 65px rgba(0,0,0,.55),0 0 35px rgba(84,220,255,.3)}
.housing:before{content:"";position:absolute;inset:2px;pointer-events:none;clip-path:inherit;background:linear-gradient(115deg,transparent 10%,rgba(255,255,255,.46) 32%,transparent 48%,rgba(105,225,255,.22) 68%,transparent 85%);animation:iceSweep 8s linear infinite}@keyframes iceSweep{from{transform:translateX(-70%)}to{transform:translateX(70%)}}
.camera-shell{position:relative;overflow:hidden;aspect-ratio:9/14;background:#01070b;clip-path:polygon(4% 0,96% 0,100% 6%,98% 92%,91% 100%,7% 98%,0 91%,1% 7%);border:2px solid rgba(228,253,255,.84);box-shadow:inset 0 0 34px rgba(81,216,255,.25)}video{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(var(--bright,1.15));transform:scale(var(--zoom,1));transition:filter .2s,transform .2s}.off{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#0f536f,#02090e);z-index:2}.off b{font-size:1.3rem}.off span{opacity:.75;margin-top:8px}.badge{position:absolute;top:16px;left:16px;z-index:6;padding:7px 10px;border-radius:999px;background:rgba(0,16,25,.72);border:1px solid var(--line);font-size:.72rem;font-weight:900;letter-spacing:.1em}.record{left:auto;right:16px;color:#ff939b}.grid{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to right,transparent 33.1%,rgba(220,250,255,.35) 33.3%,rgba(220,250,255,.35) 33.7%,transparent 33.9%,transparent 66.1%,rgba(220,250,255,.35) 66.3%,rgba(220,250,255,.35) 66.7%,transparent 66.9%),linear-gradient(to bottom,transparent 33.1%,rgba(220,250,255,.35) 33.3%,rgba(220,250,255,.35) 33.7%,transparent 33.9%,transparent 66.1%,rgba(220,250,255,.35) 66.3%,rgba(220,250,255,.35) 66.7%,transparent 66.9%)}.grid[hidden],.record[hidden]{display:none}.count{position:absolute;inset:0;z-index:8;display:grid;place-content:center;font-size:5rem;font-weight:900;text-shadow:0 0 24px #5de4ff}.quick{position:absolute;left:0;right:0;bottom:20px;z-index:7;display:flex;align-items:center;justify-content:center;gap:24px}.quick button,.dock button,.drawer button{border:1px solid rgba(200,247,255,.72);color:#eaffff;background:linear-gradient(145deg,rgba(203,249,255,.56),rgba(47,156,193,.72) 38%,rgba(6,58,84,.96));box-shadow:inset 0 1px rgba(255,255,255,.45),0 8px 18px rgba(0,0,0,.38);font-weight:850}.round{width:54px;height:54px;border-radius:50%}.shutter{width:80px!important;height:80px!important;border-radius:50%;padding:8px!important;background:rgba(225,250,255,.36)!important}.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#f3feff,#83dff4 56%,#1a739a);border:4px solid rgba(255,255,255,.78)}button:disabled{opacity:.38}.drawer-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.drawer-toggle{padding:12px 8px;border-radius:18px}.drawer{border:1px solid var(--line);background:var(--glass);border-radius:22px;padding:13px;margin:10px 0;box-shadow:inset 0 1px rgba(255,255,255,.12),0 10px 25px rgba(0,0,0,.28)}.drawer[hidden]{display:none}.drawer h2{font-size:1rem;margin:0 0 10px}.control{display:grid;grid-template-columns:100px 1fr 52px;align-items:center;gap:8px;margin:12px 0;font-size:.88rem}.control input{width:100%}.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid rgba(190,244,255,.14)}select{width:100%;padding:10px;border-radius:12px;background:#092d42;color:#efffff;border:1px solid var(--line)}.skie-box{display:grid;grid-template-columns:1fr auto;gap:8px}.skie-box input{min-width:0;padding:11px;border-radius:13px;border:1px solid var(--line);background:#041b29;color:#eaffff}.skie-box button{padding:10px 14px;border-radius:13px}.reply{margin:10px 0 0;padding:10px;border-radius:13px;background:rgba(72,190,226,.12);min-height:42px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.shot{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:#04131e;border:1px solid var(--line)}.shot img,.shot video{width:100%;height:100%;object-fit:cover;transform:none;filter:none}.shot a{position:absolute;right:4px;bottom:4px;background:#02131f;color:white;text-decoration:none;padding:4px 7px;border-radius:8px;font-size:.67rem}.dock{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(500px,calc(100% - 18px));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;border:1px solid var(--line);background:rgba(2,18,28,.93);backdrop-filter:blur(15px);border-radius:24px}.dock button{padding:12px 4px;border-radius:15px;font-size:.84rem}.hidden-canvas{display:none}@media(prefers-reduced-motion:reduce){.housing:before{animation:none}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><small>Alaska Ice Crystals</small><strong>OSKO Camera</strong></div><span id="status" class="status">Ready</span></header>
<section class="housing"><section class="camera-shell"><video id="preview" autoplay playsinline muted></video><canvas id="canvas" class="hidden-canvas"></canvas><div id="off" class="off"><b>Camera is ready</b><span>Tap Start below</span></div><div class="badge">ICE CRYSTAL VIEW</div><div id="recordBadge" class="badge record" hidden>● RECORDING</div><div id="grid" class="grid" hidden></div><div id="count" class="count" hidden></div><div class="quick"><button id="flipQuick" class="round" disabled aria-label="Switch camera">↻</button><button id="photoQuick" class="shutter" disabled aria-label="Take photo"><span></span></button><button id="videoQuick" class="round" disabled aria-label="Record video">●</button></div></section></section>
<div class="drawer-row"><button class="drawer-toggle" data-panel="cameraPanel">Camera</button><button class="drawer-toggle" data-panel="skiePanel">SKIE</button><button class="drawer-toggle" data-panel="galleryPanel">Pictures</button></div>
<section id="cameraPanel" class="drawer" hidden><h2>Controls inside the camera</h2><label class="control"><span>Brightness</span><input id="brightness" type="range" min="70" max="220" value="115"><output id="brightOut">115%</output></label><label class="control"><span>Digital zoom</span><input id="zoom" type="range" min="1" max="4" step=".1" value="1"><output id="zoomOut">1.0×</output></label><label class="control"><span>Timer</span><select id="timer"><option value="0">Off</option><option value="3">3 sec</option><option value="5">5 sec</option><option value="10">10 sec</option></select><span></span></label><label class="toggle"><span>Grid</span><input id="gridToggle" type="checkbox"></label><label class="toggle"><span>Speak button names</span><input id="speakButtons" type="checkbox"></label></section>
<section id="skiePanel" class="drawer" hidden><h2>Talk to SKIE</h2><div class="skie-box"><input id="skieText" placeholder="Type: take picture, switch camera, start video..."><button id="talkBtn">🎙 Talk</button></div><div id="reply" class="reply">SKIE is ready.</div></section>
<section id="galleryPanel" class="drawer" hidden><h2>Recent photos and videos</h2><div id="gallery" class="gallery"></div></section>
</main>
<nav class="dock"><button id="startBtn">Start</button><button id="photoBtn" disabled>Photo</button><button id="videoBtn" disabled>Video</button><button id="flipBtn" disabled>Flip</button></nav>
<script>
(()=>{let stream=null,facing='environment',recorder=null,chunks=[],recording=false;const $=id=>document.getElementById(id),video=$('preview'),canvas=$('canvas'),status=$('status'),off=$('off'),recordBadge=$('recordBadge'),gallery=$('gallery');const speak=t=>{if(!('speechSynthesis'in window))return;speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))};function setStatus(t){status.textContent=t}function setEnabled(on){['photoBtn','videoBtn','flipBtn','photoQuick','videoQuick','flipQuick'].forEach(id=>$(id).disabled=!on)}async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160}},audio:true});video.srcObject=stream;await video.play();off.hidden=true;setEnabled(true);$('startBtn').textContent='Restart';setStatus('Camera on')}catch(e){setStatus('Permission needed');$('reply').textContent='Chrome needs camera and microphone permission. '+e.message}}function countdown(sec){return new Promise(resolve=>{if(!sec)return resolve();let n=sec,el=$('count');el.hidden=false;el.textContent=n;const id=setInterval(()=>{n--;if(n<=0){clearInterval(id);el.hidden=true;resolve()}else el.textContent=n},1000)})}async function photo(){if(!stream)return;await countdown(Number($('timer').value));const w=video.videoWidth||1920,h=video.videoHeight||1080;canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.filter=`brightness(${$('brightness').value/100})`;c.drawImage(video,0,0,w,h);canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),box=document.createElement('div');box.className='shot';box.innerHTML=`<img alt="OSKO capture"><a download="OSKO-${Date.now()}.jpg">Save</a>`;box.querySelector('img').src=url;box.querySelector('a').href=url;gallery.prepend(box);setStatus('Photo captured');speak('Picture captured')},'image/jpeg',.96)}function videoRecord(){if(!stream)return;if(recording){recorder.stop();return}chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType}),url=URL.createObjectURL(blob),box=document.createElement('div');box.className='shot';box.innerHTML=`<video controls playsinline></video><a download="OSKO-${Date.now()}.webm">Save</a>`;box.querySelector('video').src=url;box.querySelector('a').href=url;gallery.prepend(box);recording=false;recordBadge.hidden=true;$('videoBtn').textContent='Video';setStatus('Video saved');speak('Recording stopped')};recorder.start();recording=true;recordBadge.hidden=false;$('videoBtn').textContent='Stop';setStatus('Recording');speak('Recording started')}async function flip(){facing=facing==='environment'?'user':'environment';await start();speak(facing==='environment'?'Rear camera':'Front camera')}function command(raw){const t=raw.toLowerCase().trim();$('skieText').value=raw;let r='I heard '+raw;if(/take|photo|picture/.test(t)){photo();r='Taking a picture.'}else if(/switch|flip|front|rear/.test(t)){flip();r='Switching camera.'}else if(/start.*video|record/.test(t)&&!/stop/.test(t)){if(!recording)videoRecord();r='Starting video.'}else if(/stop.*video|stop.*record/.test(t)){if(recording)videoRecord();r='Stopping video.'}else if(/grid.*on|show grid/.test(t)){$('gridToggle').checked=true;$('grid').hidden=false;r='Grid on.'}else if(/grid.*off|hide grid/.test(t)){$('gridToggle').checked=false;$('grid').hidden=true;r='Grid off.'}else if(/start camera|open camera/.test(t)){start();r='Opening camera.'}$('reply').textContent=r;speak(r)}$('startBtn').onclick=start;$('photoBtn').onclick=$('photoQuick').onclick=photo;$('videoBtn').onclick=$('videoQuick').onclick=videoRecord;$('flipBtn').onclick=$('flipQuick').onclick=flip;$('brightness').oninput=e=>{video.style.setProperty('--bright',e.target.value/100);$('brightOut').value=e.target.value+'%'};$('zoom').oninput=e=>{video.style.setProperty('--zoom',e.target.value);$('zoomOut').value=Number(e.target.value).toFixed(1)+'×'};$('gridToggle').onchange=e=>$('grid').hidden=!e.target.checked;document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const p=$(b.dataset.panel),open=p.hidden;document.querySelectorAll('.drawer').forEach(x=>x.hidden=true);p.hidden=!open;if($('speakButtons').checked)speak(b.textContent)});$('skieText').addEventListener('keydown',e=>{if(e.key==='Enter')command(e.target.value)});$('talkBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('reply').textContent='Voice recognition is not available here. Type the command instead.';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.onstart=()=>{$('reply').textContent='Listening...'};r.onresult=e=>command(e.results[0][0].transcript);r.onerror=e=>{$('reply').textContent='Voice error: '+e.error};r.start()};})();
</script>
</body>
</html>
