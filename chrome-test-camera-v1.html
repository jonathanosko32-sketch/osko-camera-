<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071827">
<title>Alaska Ice Crystals Camera — Chrome Test V1</title>
<style>
:root{--deep:#061522;--sea:#0b4f73;--ice:#9be8ff;--crystal:#dff9ff;--line:rgba(183,240,255,.38);--glass:rgba(7,35,52,.76)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#1676a0 0,#08283b 34%,#030b12 78%);color:#eafcff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.app{max-width:520px;margin:auto;padding:env(safe-area-inset-top) 10px calc(84px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 4px}.brand small{display:block;letter-spacing:.22em;color:#8bdfff;font-weight:800}.brand strong{font-size:1.35rem}.status{font-size:.76rem;border:1px solid var(--line);background:rgba(2,19,29,.7);padding:7px 10px;border-radius:999px}.camera-shell{position:relative;overflow:hidden;aspect-ratio:9/14;border-radius:32px 18px 34px 20px;border:2px solid rgba(197,246,255,.72);background:#01070b;box-shadow:0 0 0 3px rgba(54,176,224,.12),0 20px 60px rgba(0,0,0,.55),inset 0 0 28px rgba(99,223,255,.2);clip-path:polygon(4% 0,95% 0,100% 6%,98% 91%,91% 100%,7% 98%,0 91%,1% 7%)}
.camera-shell:before{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(115deg,transparent 15%,rgba(178,244,255,.1) 40%,transparent 62%);animation:sweep 8s linear infinite}@keyframes sweep{from{transform:translateX(-90%)}to{transform:translateX(90%)}}
video{width:100%;height:100%;object-fit:cover;display:block;filter:brightness(var(--bright,1.15));transform:scale(var(--zoom,1))}.off{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#0d4966,#020a10);z-index:2}.off b{font-size:1.25rem}.off span{opacity:.75;margin-top:7px}.badge{position:absolute;top:15px;left:16px;z-index:6;padding:6px 9px;border-radius:999px;background:rgba(1,14,22,.72);border:1px solid var(--line);font-size:.72rem;font-weight:800;letter-spacing:.08em}.record{left:auto;right:16px;color:#ff8d96}.grid{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(to right,transparent 33.1%,rgba(220,250,255,.35) 33.3%,rgba(220,250,255,.35) 33.7%,transparent 33.9%,transparent 66.1%,rgba(220,250,255,.35) 66.3%,rgba(220,250,255,.35) 66.7%,transparent 66.9%),linear-gradient(to bottom,transparent 33.1%,rgba(220,250,255,.35) 33.3%,rgba(220,250,255,.35) 33.7%,transparent 33.9%,transparent 66.1%,rgba(220,250,255,.35) 66.3%,rgba(220,250,255,.35) 66.7%,transparent 66.9%)}
.grid[hidden],.record[hidden]{display:none}.count{position:absolute;inset:0;z-index:8;display:grid;place-content:center;font-size:5rem;font-weight:900;text-shadow:0 0 24px #5de4ff}.quick{position:absolute;left:0;right:0;bottom:20px;z-index:7;display:flex;align-items:center;justify-content:center;gap:24px}.quick button,.dock button,.drawer button{border:1px solid rgba(190,244,255,.55);color:#dff9ff;background:linear-gradient(145deg,rgba(120,220,246,.34),rgba(7,54,79,.92));box-shadow:inset 0 1px rgba(255,255,255,.32),0 7px 18px rgba(0,0,0,.35);font-weight:800}.round{width:52px;height:52px;border-radius:50%}.shutter{width:76px!important;height:76px!important;border-radius:50%;padding:8px!important;background:rgba(225,250,255,.3)!important}.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:linear-gradient(145deg,#ecfdff,#69cce9 65%,#17638a);border:4px solid rgba(255,255,255,.75)}button:disabled{opacity:.38}.drawer-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.drawer-toggle{padding:12px 8px;border-radius:16px}.drawer{border:1px solid var(--line);background:var(--glass);border-radius:20px;padding:12px;margin:10px 0;box-shadow:inset 0 1px rgba(255,255,255,.12)}.drawer[hidden]{display:none}.drawer h2{font-size:1rem;margin:0 0 10px}.control{display:grid;grid-template-columns:100px 1fr 52px;align-items:center;gap:8px;margin:11px 0;font-size:.88rem}.control input{width:100%}.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid rgba(190,244,255,.13)}select{width:100%;padding:10px;border-radius:12px;background:#092c40;color:#eaffff;border:1px solid var(--line)}.skie-box{display:grid;grid-template-columns:1fr auto;gap:8px}.skie-box input{min-width:0;padding:11px;border-radius:13px;border:1px solid var(--line);background:#041b29;color:#eaffff}.skie-box button{padding:10px 14px;border-radius:13px}.reply{margin:10px 0 0;padding:10px;border-radius:13px;background:rgba(72,190,226,.12);min-height:42px}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.shot{position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;background:#04131e;border:1px solid var(--line)}.shot img,.shot video{width:100%;height:100%;object-fit:cover;transform:none;filter:none}.shot a{position:absolute;right:4px;bottom:4px;background:#02131f;color:white;text-decoration:none;padding:4px 7px;border-radius:8px;font-size:.67rem}.dock{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(500px,calc(100% - 18px));display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;border:1px solid var(--line);background:rgba(2,18,28,.92);backdrop-filter:blur(15px);border-radius:22px}.dock button{padding:11px 4px;border-radius:14px;font-size:.82rem}.hidden-canvas{display:none}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><small>ALASKA ICE CRYSTALS</small><strong>OSKO Camera</strong></div><span id="status" class="status">Ready</span></header>
<section class="camera-shell">
<video id="preview" autoplay playsinline muted></video><canvas id="canvas" class="hidden-canvas"></canvas>
<div id="off" class="off"><b>Camera is ready</b><span>Tap Start below</span></div><div class="badge">ICE CRYSTAL VIEW</div><div id="recordBadge" class="badge record" hidden>● RECORDING</div><div id="grid" class="grid" hidden></div><div id="count" class="count" hidden></div>
<div class="quick"><button id="flipQuick" class="round" disabled aria-label="Switch camera">↻</button><button id="photoQuick" class="shutter" disabled aria-label="Take photo"><span></span></button><button id="videoQuick" class="round" disabled aria-label="Record video">●</button></div>
</section>
<div class="drawer-row"><button class="drawer-toggle" data-panel="cameraPanel">Camera</button><button class="drawer-toggle" data-panel="skiePanel">SKIE</button><button class="drawer-toggle" data-panel="galleryPanel">Pictures</button></div>
<section id="cameraPanel" class="drawer" hidden><h2>Controls inside the camera</h2><label class="control"><span>Brightness</span><input id="brightness" type="range" min="70" max="220" value="115"><output id="brightOut">115%</output></label><label class="control"><span>Digital zoom</span><input id="zoom" type="range" min="1" max="4" step=".1" value="1"><output id="zoomOut">1.0×</output></label><label class="control"><span>Timer</span><select id="timer"><option value="0">Off</option><option value="3">3 sec</option><option value="5">5 sec</option><option value="10">10 sec</option></select><span></span></label><label class="toggle"><span>Grid</span><input id="gridToggle" type="checkbox"></label><label class="toggle"><span>Speak button names</span><input id="speakButtons" type="checkbox"></label></section>
<section id="skiePanel" class="drawer" hidden><h2>Talk to SKIE</h2><div class="skie-box"><input id="skieText" placeholder="Type: take picture, switch camera, start video..."><button id="talkBtn">🎙 Talk</button></div><div id="reply" class="reply">SKIE is ready.</div></section>
<section id="galleryPanel" class="drawer" hidden><h2>Recent photos and videos</h2><div id="gallery" class="gallery"></div></section>
</main>
<nav class="dock"><button id="startBtn">Start</button><button id="photoBtn" disabled>Photo</button><button id="videoBtn" disabled>Video</button><button id="flipBtn" disabled>Flip</button></nav>
<script>
(()=>{let stream=null,facing='environment',recorder=null,chunks=[],recording=false;const $=id=>document.getElementById(id),video=$('preview'),canvas=$('canvas'),status=$('status'),off=$('off'),recordBadge=$('recordBadge'),gallery=$('gallery');
const speak=t=>{if(!('speechSynthesis'in window))return; speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));};
function setStatus(t){status.textContent=t}function setEnabled(on){['photoBtn','videoBtn','flipBtn','photoQuick','videoQuick','flipQuick'].forEach(id=>$(id).disabled=!on)}
async function start(){try{if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:3840},height:{ideal:2160}},audio:true});video.srcObject=stream;await video.play();off.hidden=true;setEnabled(true);$('startBtn').textContent='Restart';setStatus('Camera on');}catch(e){setStatus('Permission needed');$('reply').textContent='Chrome needs camera and microphone permission. '+e.message;}}
function countdown(sec){return new Promise(resolve=>{if(!sec)return resolve();let n=sec;const el=$('count');el.hidden=false;el.textContent=n;const id=setInterval(()=>{n--;if(n<=0){clearInterval(id);el.hidden=true;resolve()}else el.textContent=n;},1000);});}
async function photo(){if(!stream)return;await countdown(Number($('timer').value));const w=video.videoWidth||1920,h=video.videoHeight||1080;canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.filter=`brightness(${$('brightness').value/100})`;c.drawImage(video,0,0,w,h);canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),box=document.createElement('div');box.className='shot';box.innerHTML=`<img alt="OSKO capture"><a download="OSKO-${Date.now()}.jpg">Save</a>`;box.querySelector('img').src=url;box.querySelector('a').href=url;gallery.prepend(box);setStatus('Photo captured');speak('Picture captured');},'image/jpeg',.96);}
function videoRecord(){if(!stream)return;if(recording){recorder.stop();return}chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(chunks,{type:recorder.mimeType}),url=URL.createObjectURL(blob),box=document.createElement('div');box.className='shot';box.innerHTML=`<video controls playsinline></video><a download="OSKO-${Date.now()}.webm">Save</a>`;box.querySelector('video').src=url;box.querySelector('a').href=url;gallery.prepend(box);recording=false;recordBadge.hidden=true;$('videoBtn').textContent='Video';setStatus('Video saved');speak('Recording stopped');};recorder.start();recording=true;recordBadge.hidden=false;$('videoBtn').textContent='Stop';setStatus('Recording');speak('Recording started');}
async function flip(){facing=facing==='environment'?'user':'environment';await start();speak(facing==='environment'?'Rear camera':'Front camera');}
function command(raw){const t=raw.toLowerCase().trim();$('skieText').value=raw;let r='I heard '+raw;if(/take|photo|picture/.test(t)){photo();r='Taking a picture.'}else if(/switch|flip|front|rear/.test(t)){flip();r='Switching camera.'}else if(/start.*video|record/.test(t)&&!/stop/.test(t)){if(!recording)videoRecord();r='Starting video.'}else if(/stop.*video|stop.*record/.test(t)){if(recording)videoRecord();r='Stopping video.'}else if(/grid.*on|show grid/.test(t)){$('gridToggle').checked=true;$('grid').hidden=false;r='Grid on.'}else if(/grid.*off|hide grid/.test(t)){$('gridToggle').checked=false;$('grid').hidden=true;r='Grid off.'}else if(/start camera|open camera/.test(t)){start();r='Opening camera.'}$('reply').textContent=r;speak(r);}
$('startBtn').onclick=start;$('photoBtn').onclick=$('photoQuick').onclick=photo;$('videoBtn').onclick=$('videoQuick').onclick=videoRecord;$('flipBtn').onclick=$('flipQuick').onclick=flip;
$('brightness').oninput=e=>{video.style.setProperty('--bright',e.target.value/100);$('brightOut').value=e.target.value+'%'};$('zoom').oninput=e=>{video.style.setProperty('--zoom',e.target.value);$('zoomOut').value=Number(e.target.value).toFixed(1)+'×'};$('gridToggle').onchange=e=>$('grid').hidden=!e.target.checked;
document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const p=$(b.dataset.panel),open=p.hidden;document.querySelectorAll('.drawer').forEach(x=>x.hidden=true);p.hidden=!open;if($('speakButtons').checked)speak(b.textContent)});
$('skieText').addEventListener('keydown',e=>{if(e.key==='Enter')command(e.target.value)});$('talkBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('reply').textContent='Voice recognition is not available here. Type the command instead.';return}const r=new SR();r.lang='en-US';r.interimResults=false;r.onstart=()=>{$('reply').textContent='Listening…';setStatus('SKIE listening')};r.onresult=e=>command(e.results[0][0].transcript);r.onerror=e=>{$('reply').textContent='Voice error: '+e.error;setStatus('Voice ready')};r.onend=()=>setStatus(stream?'Camera on':'Ready');r.start()};
window.addEventListener('beforeunload',()=>stream?.getTracks().forEach(t=>t.stop()));})();
</script>
</body></html>
