<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <title>OSKO Camera</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div><p class="eyebrow">OSKO</p><h1>Camera</h1></div>
      <span id="status" class="status">Ready</span>
    </header>

    <section class="camera-card" aria-label="Camera preview">
      <video id="preview" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div id="gridOverlay" class="grid-overlay" hidden aria-hidden="true"></div>
      <div id="emptyState" class="empty-state"><strong>Camera is off</strong><span>Tap Start Camera to begin.</span></div>
      <div id="recordingBadge" class="recording-badge" hidden>● Recording</div>
      <div id="countdown" class="countdown" hidden></div>
    </section>

    <section class="quick-tools" aria-label="Camera options">
      <label class="tool-row">Zoom <input id="zoomRange" type="range" min="1" max="1" step="0.1" value="1" disabled><span id="zoomValue">1.0×</span></label>
      <label class="toggle"><input id="gridToggle" type="checkbox"><span>Grid</span></label>
      <label class="toggle"><input id="stampToggle" type="checkbox"><span>Date/time stamp</span></label>
      <label class="toggle"><input id="locationToggle" type="checkbox"><span>Location stamp</span></label>
      <label class="select-tool">Timer
        <select id="timerSelect"><option value="0">Off</option><option value="3">3 sec</option><option value="5">5 sec</option><option value="10">10 sec</option></select>
      </label>
    </section>

    <section class="controls" aria-label="Camera controls">
      <button id="startBtn" class="primary">Start Camera</button>
      <button id="captureBtn" disabled>Take Photo</button>
      <button id="recordBtn" disabled>Record Video</button>
      <button id="switchBtn" disabled>Switch Camera</button>
    </section>

    <section class="gallery-section">
      <div class="section-heading"><h2>Recent captures</h2><button id="clearBtn" class="text-button">Clear</button></div>
      <div id="gallery" class="gallery"><p class="gallery-empty">Photos and videos will appear here.</p></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
