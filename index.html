<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071827">
  <title>OSKO Camera</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div><p class="eyebrow">OSKO</p><h1>Camera</h1></div><span id="status" class="status">Ready</span></header>

    <section id="cameraCard" class="camera-card" aria-label="Camera preview">
      <video id="preview" autoplay playsinline muted></video>
      <canvas id="canvas" hidden></canvas>
      <div id="gridOverlay" class="grid-overlay" hidden></div>
      <div id="emptyState" class="empty-state"><strong>Camera is off</strong><span>Tap Start Camera.</span></div>
      <div id="recordingBadge" class="recording-badge" hidden>● Recording</div>
      <div id="steadyBadge" class="steady-badge" hidden>STEADY</div>
      <div id="countdown" class="countdown" hidden></div>
      <button id="quickTorchBtn" class="quick-light" type="button" aria-label="Turn light on">LIGHT</button>
      <button id="fullscreenBtn" class="fullscreen-btn" type="button" aria-label="Full screen">⛶</button>
      <div class="viewfinder-controls">
        <button id="quickSwitchBtn" class="viewfinder-small" type="button" disabled aria-label="Switch camera">↻</button>
        <button id="quickCaptureBtn" class="shutter" type="button" disabled aria-label="Take photo"><span></span></button>
        <button id="quickRecordBtn" class="viewfinder-small record-dot" type="button" disabled aria-label="Record video">●</button>
      </div>
    </section>

    <div id="errorBox" class="error-box" hidden></div>

    <section class="quick-tools" aria-label="Camera options">
      <label class="tool-row">Brightness <input id="brightnessRange" type="range" min="100" max="320" step="5" value="150"><span id="brightnessValue">150%</span></label>
      <label class="tool-row">Zoom <input id="zoomRange" type="range" min="1" max="1" step="0.1" value="1" disabled><span id="zoomValue">1.0×</span></label>
      <label class="toggle"><input id="steadyToggle" type="checkbox" checked><span>Steady mode</span></label>
      <label class="toggle"><input id="nightToggle" type="checkbox"><span>Night boost</span></label>
      <label class="toggle"><input id="screenLightToggle" type="checkbox"><span>Screen light</span></label>
      <label class="toggle"><input id="torchToggle" type="checkbox" disabled><span>Camera flashlight</span></label>
      <label class="toggle"><input id="gridToggle" type="checkbox"><span>Grid</span></label>
      <label class="toggle"><input id="stampToggle" type="checkbox"><span>Date/time stamp</span></label>
      <label class="toggle"><input id="locationToggle" type="checkbox"><span>Location stamp</span></label>
      <label class="select-tool">Timer<select id="timerSelect"><option value="0">Off</option><option value="3">3 sec</option><option value="5">5 sec</option><option value="10">10 sec</option></select></label>
    </section>

    <section class="controls">
      <button id="startBtn" class="primary" type="button">Start Camera</button>
      <button id="captureBtn" type="button" disabled>Take Photo</button>
      <button id="recordBtn" type="button" disabled>Record Video</button>
      <button id="switchBtn" type="button" disabled>Switch Camera</button>
      <label class="native-button">Use Phone Camera<input id="nativeCapture" type="file" accept="image/*,video/*" capture="environment"></label>
    </section>

    <section class="gallery-section"><div class="section-heading"><h2>Recent captures</h2><button id="clearBtn" class="text-button" type="button">Clear</button></div><div id="gallery" class="gallery"><p class="gallery-empty">Photos and videos will appear here.</p></div></section>
  </main>

  <nav class="bottom-dock" aria-label="Main camera controls">
    <button id="dockStart" type="button">Start</button><button id="dockPhoto" type="button" disabled>Photo</button><button id="dockVideo" type="button" disabled>Video</button><button id="dockSwitch" type="button" disabled>Flip</button>
  </nav>
  <script src="app.js"></script>
</body>
</html>
